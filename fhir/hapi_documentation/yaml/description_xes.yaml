url: AuditEvent/$xes
version: 1.0.0
name: AuditEventToXES
title: Transform AuditEvents to XES
status: active
kind: operation
date: 2025-05-13
publisher: FH Upper Austria
contact:
    - name: FH Upper Austria
description: Transforms AuditEvents into an XES Log and also allows to filter the AuditEvents before
code:
    comment: implemented for R5 AuditEvents
base:
resource:
    resource: AuditEvent
system: false
type: true
instance: false
parameter:
	- name: start
	  use: in
	  min: 0
	  max: 1
	  documentation: 	Filters the events based on the AuditEvent.occurredDateTime.start attribute.
					Events that occurred after the start date are being cut out.
					
	  type: datetime
	
	- name: end
	  use: in
	  min: 0
	  max: 1
	  documentation: 	Filters the events based on the AuditEvent.occurredDateTime.end attribute.
					Events that occurred before the start date are being cut out
	  type: datetime
	
	
	- name: core
	  use: in
	  min: 0
	  max: *
	  documentation: 	Filters the events based on the AuditEvent.patient.reference or the AuditEvent.patient.identifier.value.
					Thus, in addition to the id, the patient reference can also be used instead.
					After applying the filter all events that don't match one of the listed patients are being cut out.
	  type: string
	
	
	- name: actor
	  use: in
	  min: 0
	  max: *
	  documentation: 	Filters the events based on the AuditEvent.encounter.reference.
					After applying the filter all events that don't match one of the referenced Actors are being cut out.
	  type: string
	
	
	- name: patientvisit
	  use: in
	  min: 0
	  max: *
	  documentation: 	Filters the events based on the AuditEvent.practitioner.reference.
					After applying the filter all events that don't match one of the referenced patientvisits are being cut out.
	  type: string
	
	
	- name: conformance
	  use: in
	  min: 0
	  max: *
	  documentation: 	Filters the events based on the AuditEvent.code.text or the AuditEvent.code.coding attributes.
					After applying the filter all events that don't match one of the referenced conformance codes are being cut out.
	  type: string