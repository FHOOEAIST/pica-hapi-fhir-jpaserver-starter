<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>BPMN File Upload</title>
    <link href="https://cdn.jsdelivr.net/npm/prismjs/themes/prism.css" rel="stylesheet" />
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; background-color: #f9f9f9; }
        h1, h2 { color: #333; }
        label { font-weight: bold; }
        input[type="text"], input[type="file"] {
          width: 400px; padding: 0.5em; margin-bottom: 1em;
          border: 1px solid #ccc; border-radius: 4px;
        }
        button {
          padding: 0.6em 1.2em; margin-top: 1em; margin-right: 1em;
          border: none; border-radius: 4px;
          background-color: #007acc; color: white; cursor: pointer;
        }
        button:disabled { background-color: #aaa; cursor: not-allowed; }
        pre {
          background: #f8f8f8; border: 1px solid #ccc;
          padding: 1em; max-width: 1000px; overflow: auto;
          white-space: pre-wrap; word-break: break-word;
        }
        #pnmlResult { margin-top: 2em; }
    </style>
</head>
<body>

<h1>Upload BPMN File</h1>

<label for="filename">Filename (without extension):</label><br />
<input type="text" id="filename" name="filename" /><br />

<label for="bpmnFile">Select BPMN XML File:</label><br />
<input type="file" id="bpmnFile" accept=".bpmn" /><br />

<button onclick="uploadFile()">Upload and Convert</button>
<button id="downloadBtn" onclick="downloadPnml()" disabled>Download PNML</button>

<h2>PNML Result</h2>
<pre id="pnmlResult"><code class="language-xml" id="pnmlCode">Waiting for conversion...</code></pre>

<script src="https://cdn.jsdelivr.net/npm/prismjs/prism.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-xml.min.js"></script>
<script>
    function uploadFile() {
      const fileInput = document.getElementById("bpmnFile");
      const filename = document.getElementById("filename").value.trim();
      const codeElem = document.getElementById("pnmlCode");
      const downloadBtn = document.getElementById("downloadBtn");

      if (!filename || !fileInput.files[0]) {
        alert("Please enter filename and select a BPMN file.");
        return;
      }

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onload = function (e) {
        const xml = e.target.result;

        codeElem.textContent = "Loading...";
        Prism.highlightElement(codeElem);
        downloadBtn.disabled = true;

        fetch("/bpmn/convert-bpmn", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ filename, xml })
        })
        .then(res => res.text())
        .then(data => {
          codeElem.textContent = data;
          Prism.highlightElement(codeElem);
          downloadBtn.disabled = false;
          downloadBtn.setAttribute("data-filename", filename + ".pnml");
        })
        .catch(err => {
          codeElem.textContent = "Error: " + err.message;
          downloadBtn.disabled = true;
        });
      };

      reader.readAsText(file);
    }

    function downloadPnml() {
      const codeElem = document.getElementById("pnmlCode");
      const downloadBtn = document.getElementById("downloadBtn");
      const text = codeElem.textContent;
      const filename = downloadBtn.getAttribute("data-filename") || "result.pnml";

      const blob = new Blob([text], { type: "application/xml" });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();

      URL.revokeObjectURL(url);
    }
</script>

</body>
</html>
